name: siams

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: .env
  volumes:
    - ./backend:/app                 # source and backend/media (dev uploads grouped by day)
  depends_on:
    db:       { condition: service_healthy }
    redis:    { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]             # dev only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports: ["15672:15672"]           # management UI, dev only
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports: ["8025:8025"]             # read every outgoing email here

  minio:                             # optional: S3-compatible storage (make up-s3)
    profiles: ["s3"]
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    # To use it: create a bucket in http://localhost:9001, then in .env set
    #   STORAGE_BACKEND=s3  AWS_S3_ENDPOINT_URL=http://minio:9000
    #   AWS_STORAGE_BUCKET_NAME=<bucket>  AWS_ACCESS_KEY_ID=minioadmin  AWS_SECRET_ACCESS_KEY=minioadmin

  backend:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      RUN_MIGRATIONS: "1"            # only this service migrates (no race with worker/beat)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    expose: ["8000"]

  worker:
    <<: *backend
    command: celery -A config worker -l info -Q default,notifications,reports
    depends_on:
      backend: { condition: service_healthy }   # healthy means migrations are done

  beat:
    <<: *backend
    command: celery -A config beat -l info
    depends_on:
      backend: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/proxy_params:/etc/nginx/proxy_params:ro
    ports: ["80:80"]
    depends_on:
      backend: { condition: service_healthy }

  # Frontend: ignored until we setup run `make up-frontend`
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: /api/v1
    expose: ["5173"]

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniodata:
