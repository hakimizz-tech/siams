name: backend-cd

# Builds the production image and pushes it to GitHub Container Registry
# only when started manually. Deployment is intentionally disabled for now:
# add a job for your platform later (SSH + compose, ECS, Cloud Run, ...).

on:
  # push:
    # tags: [v*.*.*]
  workflow_dispatch:
    inputs:
      storage_extra:
        description: "Object storage SDK to bake in (s3 | gcs | azure)"
        default: "s3"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/siams-backend
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          build-args: |
            STORAGE_EXTRA=${{ inputs.storage_extra || 's3' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # deploy:
