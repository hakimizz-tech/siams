# Development reverse proxy. Same-origin: the React app and the API share http://localhost.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream backend { server backend:8000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;            # largest upload is the 10 MB final report plus overhead

    # Docker's embedded DNS. The frontend host is resolved lazily so Nginx still
    # starts when the optional `frontend` compose profile is not running.
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }
    location /api/    { proxy_pass http://backend; include /etc/nginx/proxy_params; }
    location /admin/  { proxy_pass http://backend; include /etc/nginx/proxy_params; }
    location /health/ { proxy_pass http://backend; include /etc/nginx/proxy_params; }
    location /static/ { proxy_pass http://backend; include /etc/nginx/proxy_params; }  # dev: Django serves static

    # There is deliberately NO /media/ route. Uploaded files are private and are
    # delivered by permission-checked API endpoints (.../file/).

    location / {                          # React dev server (Vite) once the frontend exists
        set $frontend_upstream http://frontend:5173;
        proxy_pass $frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;     # hot reload websocket
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        error_page 502 504 = @frontend_down;
    }
    location @frontend_down {
        default_type text/plain;
        return 503 "Frontend is not running. Start it with: make up-frontend\n";
    }
}
