# Production reverse proxy. Terminates plain HTTP and trusts X-Forwarded-Proto from a
# TLS-terminating load balancer (cloud LB, Caddy, Cloudflare ...).
# To terminate TLS in this container instead, see the commented block at the bottom.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

upstream backend  { server backend:8000; }
upstream frontend { server frontend:8080; }

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    server_tokens off;

    location = /api/v1/auth/login/ {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://backend;
        include /etc/nginx/proxy_params;
    }
    location /api/    { proxy_pass http://backend; include /etc/nginx/proxy_params; }
    location /admin/  { proxy_pass http://backend; include /etc/nginx/proxy_params; }
    location /health/ { proxy_pass http://backend; include /etc/nginx/proxy_params; }

    location /static/ {                   # Django admin / API docs static files (shared volume)
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # The React app. The frontend container sets its own cache and security headers (CSP, nosniff ...).
    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
    }
}

